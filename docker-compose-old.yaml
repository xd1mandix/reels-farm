version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: reelsfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reelsfarm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
