version: "3.9"

services:
  strapi:
    build: .
    container_name: reelsfarm-strapi
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads:/app/public/uploads
    expose:
      - "1337"

  postgres:
    image: postgres:17
    container_name: reelsfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelsfarm
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: reelsfarm-redis
    restart: unless-stopped
    expose:
      - "6379"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: reelsfarm-ngrok
    restart: unless-stopped
    command: http strapi:1337
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
  # nginx:
  #   image: nginx:alpine
  #   container_name: reelsfarm-nginx
  #   restart: unless-stopped
